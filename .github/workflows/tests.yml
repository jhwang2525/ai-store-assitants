name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest -q
      - name: Run the evaluation (offline embedder)
        run: PYTHONPATH=src python -m rag_assistant --embedder hashing eval
